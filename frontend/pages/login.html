<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <script src="../js/theme.js"></script>
  <title>Login | E-Waste Management System</title>
</head>
<body class="page-body">
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">♻️ E-Waste<span>Manager</span></a>
      <div class="nav-buttons">
        <button id="themeToggle" type="button" class="btn btn-outline" aria-pressed="false">Dark mode</button>
        <a href="register.html" class="btn btn-primary">Register</a>
      </div>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="container" style="display:flex;justify-content:center;">
      <section class="auth-card">
        <h1>Welcome back</h1>
        <p class="lead">Log in to submit e-waste and track your pickups.</p>

        <form id="loginForm" novalidate>
          <div id="formAlert" class="form-alert" role="alert"></div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      </section>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
